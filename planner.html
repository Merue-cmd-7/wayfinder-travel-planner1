<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder Travel Planner | Trip Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-container" aria-label="Main Navigation">
      <a href="index.html" class="brand">Wayfinder Travel Planner</a>
      <ul class="nav-links">
        <li><a href="index.html">Home &amp; Weather</a></li>
        <li><a href="planner.html" class="active">Trip Planner</a></li>
        <li><a href="tips.html">Packing &amp; Tips</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="grid-2">
      <article class="card">
        <h2>Add a Trip</h2>
        <p class="muted-text">Enter your destination details and estimated budget to add it to your itinerary.</p>

        <form id="simpleTripForm">
          <div class="field">
            <label for="cityName" class="block-label">Destination:</label>
            <input type="text" id="cityName" name="cityName" placeholder="e.g. Lisbon">
          </div>

          <div class="field">
            <label for="tripType" class="block-label">Trip Type:</label>
            <select id="tripType" name="tripType">
              <option value="">Choose one</option>
              <option value="Holiday">Holiday</option>
              <option value="Work">Work</option>
            </select>
          </div>

          <div class="field">
            <span class="block-label">Transport:</span>
            <div class="inline-options">
              <label><input type="radio" name="transport" value="Flight"> Flight</label>
              <label><input type="radio" name="transport" value="Train"> Train</label>
            </div>
          </div>

          <div class="field">
            <label><input type="checkbox" id="needHotel" name="needHotel" value="Hotel"> Hotel needed</label>
          </div>

          <div class="field">
            <label for="cost" class="block-label">Budget (EUR):</label>
            <input type="number" id="cost" name="cost" placeholder="e.g. 450">
          </div>

          <button type="submit" class="btn btn-accent">Add Trip</button>
        </form>
      </article>

      <article class="card">
        <h2>Saved Trips</h2>

        <div class="toolbar">
          <label for="search-trips" class="sr-only">Search trips</label>
          <input type="text" id="search-trips" placeholder="Search by destination...">
          <button type="button" id="clear-search-btn" class="btn btn-outline">Reset</button>
        </div>

        <div id="trip-list" class="trip-list" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Wayfinder Travel Planner | COMP H1035 Client-Side Web Development</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
